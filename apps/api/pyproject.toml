[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "encaixe-api"
version = "0.1.0"
description = "Encaixe FastAPI service: LangGraph agent + REST + webhooks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arthur Viegas", email = "arthurpviegas@gmail.com" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "httpx>=0.27.0",
    "anthropic>=0.39.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "voyageai>=0.3.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi,celery,httpx,asyncpg]>=2.18.0",
    "python-jose[cryptography]>=3.3.0",
    "google-auth>=2.34.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.140.0",
    "qrcode[pil]>=7.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-redis",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
# Default to *unit* tests; integration suite (real Postgres) opts in
# with `-m integration` (see Makefile target test-integration).
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
markers = [
    "integration: real-database tests; require docker compose up postgres",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# B008 (function-call-in-default-arg) fires on every FastAPI route that
# uses Depends() or Security() — that's literally the framework idiom,
# not a bug. Disabling it globally is cleaner than 20 noqas.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Tests that need to import a module AFTER patching sys.modules to wire
# in a stub for an optional dep (anthropic, voyageai). Module-level
# import ordering is intentional here.
"tests/agent/test_generate_response.py" = ["E402"]
"tests/agent/test_retrieve_context.py" = ["E402"]
# worker.tasks reraises Celery's `self.retry(exc=exc)` deliberately
# without `from`: Celery's machinery inspects the bare exception to
# decide retry/permanent-failure semantics. Using `raise ... from exc`
# would shadow the original traceback chain Celery already preserves.
"src/worker/tasks.py" = ["B904"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

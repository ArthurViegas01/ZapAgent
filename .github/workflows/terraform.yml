name: Terraform — Railway Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/environments/railway/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/environments/railway/**"
      - ".github/workflows/terraform.yml"

defaults:
  run:
    working-directory: infra/terraform/environments/railway

jobs:
  terraform:
    name: Plan & Apply
    runs-on: ubuntu-22.04

    env:
      TF_VAR_railway_token:           ${{ secrets.RAILWAY_TOKEN }}
      TF_VAR_github_repo:             ${{ secrets.GH_REPO }}
      TF_VAR_supabase_url:            ${{ secrets.SUPABASE_URL }}
      TF_VAR_supabase_anon_key:       ${{ secrets.SUPABASE_ANON_KEY }}
      TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TF_VAR_supabase_db_url:         ${{ secrets.SUPABASE_DB_URL }}
      TF_VAR_anthropic_api_key:       ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_voyage_api_key:          ${{ secrets.VOYAGE_API_KEY }}
      TF_VAR_evolution_api_key:       ${{ secrets.EVOLUTION_API_KEY }}
      TF_VAR_google_oauth_client_id:  ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      TF_VAR_google_oauth_redirect_uri: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: terraform init
        run: terraform init

      - name: terraform fmt check
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan
        # Always plan; apply only on push to main.

      - name: terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

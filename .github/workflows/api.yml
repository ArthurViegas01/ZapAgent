name: API — Lint, Type-check & Test

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"

defaults:
  run:
    working-directory: apps/api

jobs:
  quality:
    name: ruff + mypy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/pyproject.toml') }}

      - name: Install dev dependencies
        run: pip install -e ".[dev]" --break-system-packages 2>/dev/null || pip install -e ".[dev]"

      - name: ruff lint
        run: ruff check src tests

      - name: ruff format check
        run: ruff format --check src tests

      - name: mypy
        run: mypy src

  test:
    name: pytest
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zapagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/zapagent_test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/zapagent_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-key
      SUPABASE_JWT_SECRET: test-jwt-secret-32-chars-minimum!!
      EVOLUTION_API_URL: http://localhost:8080
      EVOLUTION_API_KEY: test-evo-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/pyproject.toml') }}

      - name: Install dependencies
        run: pip install -e ".[dev]" --break-system-packages 2>/dev/null || pip install -e ".[dev]"

      - name: Run DB migrations
        run: psql $DATABASE_URL_SYNC -f ../../db/migrations/0001_init.sql
        env:
          PGPASSWORD: postgres

      - name: pytest
        run: pytest tests/ -v --tb=short --no-header -q

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-22.04
    needs: [quality, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service zapagent-api --detach

      - name: Deploy Worker service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service zapagent-worker --detach

# ZapAgent — local development stack.
# Spins up: postgres (with pgvector), redis, evolution-api, fastapi, celery worker.
# Set WHATSAPP_PROVIDER=stub in .env to skip the evolution container entirely
# (use `docker compose up postgres redis api worker`) and run end-to-end
# without any external WhatsApp gateway.
# Production deployments use the Terraform stack in infra/terraform.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: encaixe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zapagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zapagent_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-zapagent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zapagent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: encaixe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  evolution:
    # Evolution API -- self-hosted WhatsApp gateway via Baileys (no Chrome/Puppeteer).
    # QR code generated in ~5-10s. No external account, no approval.
    # Docs: https://doc.evolution-api.com
    #
    # The DATABASE_* envs are mandatory in v2: Evolution runs `prisma migrate
    # deploy` at boot and will crash with "Database provider invalid" if any
    # of PROVIDER / CONNECTION_URI / ENABLED is missing. We reuse the app's
    # Postgres container under a separate schema so the two never collide.
    #
    # dns + sysctls: WSL2/Docker can silently drop WebSocket connections to
    # WhatsApp servers due to MTU mismatch (WSL2 virtual NIC) and DNS failures.
    # Using Google DNS and clamping TCP MSS to 1400 (< default 1460) fixes both.
    #
    # build: custom image (apps/evolution/Dockerfile) updates @whiskeysockets/baileys
    # to the latest version so the noise-protocol handshake matches WhatsApp's
    # current server keys. Evolution 2.2.3 ships with an old Baileys that fails
    # silently at the handshake — WebSocket opens (101) but QR is never generated.
    build:
      context: ./apps/evolution
      dockerfile: Dockerfile
    image: encaixe-evolution:local
    container_name: encaixe-evolution
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    sysctls:
      net.ipv4.tcp_mtu_probing: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-changeme}
      # -- Database (mandatory; isolated under schema=evolution_api) -----
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-zapagent}:${POSTGRES_PASSWORD:-zapagent_local_dev}@postgres:5432/${POSTGRES_DB:-zapagent}?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      # -- Redis cache (db 3 keeps it apart from celery broker/results) --
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/3
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      # -- @lid sender_pn intercept (lid_pipe.py, embedded in this image) --
      # Same Redis DB as the API (db 0); webhook reads `lid_pn:{msg_id}` here.
      REDIS_URL: redis://redis:6379/0
      LID_TTL_SECONDS: "86400"
      # -- QR / logs -----------------------------------------------------
      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "#007bff"
      # Per-instance webhooks are configured by the API on /instance/create,
      # so we keep the GLOBAL hook off.
      WEBHOOK_GLOBAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      # Force the WA Web version that we confirmed passes WhatsApp's noise handshake.
      # Without this, Evolution falls back to a cached/stale version that gets 405.
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1035194821"
      LOG_LEVEL: ERROR,WARN,DEBUG,INFO,LOG,VERBOSE
      LOG_BAILEYS: debug
      LOG_COLOR: "false"
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    container_name: encaixe-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override host names para acesso intra-rede do Docker.
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_WEBHOOK_BASE_URL: http://api:8000/webhooks/whatsapp
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/src

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    container_name: encaixe-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      EVOLUTION_API_URL: http://evolution:8080
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
    command: >
      celery -A src.worker.celery_app worker
      --loglevel=INFO
      --concurrency=2

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  api_venv:
